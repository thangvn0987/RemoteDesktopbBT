<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RemoteBT - Bộ Điều Khiển WS Tự Động</title>
    <link rel="stylesheet" href="../tools/ws.css" />
  </head>
  <body>
    <h2>Bộ Điều Khiển WebSocket Tự Động</h2>
    <fieldset>
      <legend>Tín hiệu (Signaling)</legend>
      <div class="row">
        <label>Host:Port tín hiệu</label>
        <input
          id="sigHost"
          type="text"
          placeholder="192-168-29-196.nip.io"
          value="192-168-29-196.nip.io"
        />
        :
        <input id="sigPort" type="number" value="8444" />
        <button id="btnHealth" style="margin-left: 8px">Kiểm tra</button>
      </div>
      <div class="row">
        <button id="btnSession">Tạo phiên & kết nối</button>
        <span id="status"></span>
        <span id="helper" style="margin-left: 12px"></span>
        <span id="ping" style="margin-left: 12px; font-weight: 500"></span>
        <button id="btnReconnect" style="margin-left: 12px; display: none">Kết nối lại</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Điều khiển</legend>
      <div class="row">
        <label>Xem trước</label>
        <button id="btnCapOn">Bắt đầu Capture</button>
        <button id="btnCapOff">Dừng</button>
        mỗi
        <input id="ival" type="number" value="500" style="width: 80px" /> ms
      </div>
      <div class="row">
        <label>Chất lượng</label>
        <input
          id="quality"
          type="range"
          min="10"
          max="95"
          value="75"
          style="width: 200px"
        />
        <span id="qualityValue">75</span>
        <span style="font-size: 12px; color: #666; margin-left: 8px">
          (10=siêu nhỏ mờ | 50=cân bằng | 95=rõ nét)
        </span>
      </div>
      <div class="row">
        <label>Bàn phím</label>
        <button id="kbToggle">Bắt đầu thu phím</button>
        <span id="kbStatus" style="margin-left: 8px"></span>
      </div>
      <div class="row">
        <img
          id="preview"
          alt="preview"
          style="
            max-width: 100%;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: crosshair;
            display: none;
          "
        />
      </div>
    </fieldset>

    <fieldset>
      <legend>Log</legend>
      <div class="row">
        <label>Chi tiết log</label>
        <input id="verbose" type="checkbox" checked />
        <span style="font-size: 12px; color: #666"
          >(bỏ chọn để giảm lag khi spam phím / move)</span
        >
        <button id="btnClear" style="margin-left: 12px">Xóa</button>
      </div>
      <div id="log"></div>
    </fieldset>

    <script src="../config.js"></script>
    <script src="../tools/ws.js"></script>
  </body>
</html>
