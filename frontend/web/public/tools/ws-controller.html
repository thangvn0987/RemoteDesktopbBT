<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WS Controller (Prototype)</title>
    <style>
      body {
        font-family: system-ui, Segoe UI, Arial;
        margin: 20px;
      }
      input,
      button {
        font-size: 14px;
        padding: 6px;
        margin: 4px;
      }
      #log {
        height: 200px;
        border: 1px solid #ccc;
        padding: 6px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h3>WebSocket Controller → Helper (via signaling bridge)</h3>
    <div>
      <label>WS URL:</label>
      <input id="wsurl" size="40" value="ws://localhost:8081" />
      <label style="margin-left: 10px">Token:</label>
      <input id="token" size="36" placeholder="paste JWT here" />
      <button id="btnConnect">Connect</button>
    </div>

    <div>
      <button onclick="send({type:'move',x:600,y:400})">Move 600,400</button>
      <button onclick="send({type:'click',button:'left'})">Click Left</button>
      <button onclick="send({type:'type',text:'Hello from WS!'})">
        Type Text
      </button>
      <button onclick="send({type:'key',combo:'Enter'})">Key Enter</button>
      <button onclick="send({type:'scroll',delta:-240})">Scroll Down</button>
    </div>

    <div>
      <input
        id="raw"
        size="60"
        placeholder='{"type":"type","text":"Xin chao"}'
      />
      <button onclick="sendRaw()">Send JSON</button>
    </div>

    <pre id="log"></pre>

    <script>
      let ws;
      const log = (m) => {
        const el = document.getElementById("log");
        el.textContent += m + "\n";
        el.scrollTop = el.scrollHeight;
      };
      document.getElementById("btnConnect").onclick = () => {
        const url = document.getElementById("wsurl").value.trim();
        const token = document.getElementById("token").value.trim();
        const full = token ? `${url}?token=${encodeURIComponent(token)}` : url;
        ws = new WebSocket(full);
        ws.onopen = () => log("ws: open");
        ws.onmessage = (ev) => log("ws: " + ev.data);
        ws.onclose = () => log("ws: close");
        ws.onerror = (e) => log("ws: error");
      };
      function send(obj) {
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify(obj));
        }
      }
      function sendRaw() {
        try {
          const obj = JSON.parse(document.getElementById("raw").value);
          send(obj);
        } catch (e) {
          log("Invalid JSON");
        }
      }
    </script>
  </body>
</html>
