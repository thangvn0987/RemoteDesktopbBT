<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remote Desktop - Bảng Điều Khiển Controller</title>
    <link rel="stylesheet" href="./controller-dashboard.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo-section">
          <h1>🎮 Bảng Điều Khiển Controller</h1>
        </div>

        <div class="profile-section">
          <div class="profile-info">
            <img
              src="https://via.placeholder.com/40"
              alt="Profile"
              class="profile-avatar"
            />
            <div class="profile-details">
              <div class="profile-name">John Doe</div>
              <div class="profile-role">Controller</div>
            </div>
          </div>

          <div class="dropdown">
            <button class="dropdown-btn" id="profile-menu">⚙️</button>
            <div class="dropdown-content" id="dropdown-menu">
              <a href="#" id="switch-role">Chuyển sang chế độ Host</a>
              <a href="#" id="settings">Cài đặt</a>
              <a href="#" id="logout">Đăng xuất</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="container">
        <!-- Add New Host Section -->
        <section class="add-host-section">
          <button class="add-host-btn" id="add-host-btn">
            <span class="add-icon">+</span>
            <span>Thêm Máy Chủ Mới</span>
          </button>
        </section>

        <!-- Hosts List -->
        <section class="hosts-section">
          <h2>Máy Chủ Khả Dụng</h2>

          <div class="hosts-grid" id="hosts-grid">
            <!-- Loading state -->
            <div class="loading-state" id="loading-state">
              <div class="loading-spinner">�</div>
              <p>Đang tải danh sách máy chủ...</p>
            </div>
          </div>

          <!-- Empty State -->
          <div class="empty-state" id="empty-state" style="display: none">
            <div class="empty-icon">🖥️</div>
            <h3>Chưa có máy chủ nào</h3>
            <p>Thêm máy chủ để bắt đầu điều khiển từ xa</p>
            <button class="add-host-btn secondary">Thêm máy chủ đầu tiên</button>
          </div>
        </section>
      </div>
    </main>

    <!-- Add Host Modal -->
    <div class="modal" id="add-host-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Thêm Máy Chủ Mới</h3>
          <button class="close-btn" id="close-modal">&times;</button>
        </div>

        <div class="modal-body">
          <form id="add-host-form">
            <div class="form-group">
              <label for="host-email">Email Máy Chủ</label>
              <input
                type="email"
                id="host-email"
                placeholder="Nhập email của máy chủ"
                required
              />
            </div>

            <div class="form-group">
              <label for="host-message">Lời mời (Tùy chọn)</label>
              <textarea
                id="host-message"
                placeholder="Chào! Mình muốn thêm bạn làm máy chủ cho phiên điều khiển từ xa."
                rows="3"
              ></textarea>
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="cancel-btn" id="cancel-btn">
            Hủy
          </button>
          <button type="submit" class="submit-btn" form="add-host-form">
            Gửi Lời Mời
          </button>
        </div>
      </div>
    </div>

    <script src="../../config.js"></script>
    <script src="./controller-dashboard.js"></script>
  </body>
</html>
