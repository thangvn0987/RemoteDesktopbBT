services:
  web-portal:
    build: ../../frontend/web
    image: remotebt/web-portal:dev
    ports:
      - "3000:80"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=development
    depends_on:
      - signaling
      - auth

  signaling:
    build: ../../services/signaling-service
    image: remotebt/signaling:dev
    ports:
      - "8080:8080"
      - "5555:5555"
    env_file:
      - ./.env
    environment:
      - LOG_LEVEL=info # Set to 'debug' for verbose logs, 'info' for production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    image: caddy:2-alpine
    container_name: caddy-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8444:8444"
    volumes:
      - ../gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - ./.env
    depends_on:
      - web-portal
      - signaling
      - auth

  auth:
    build: ../../services/auth-service
    image: remotebt/auth:dev
    ports:
      - "8081:8081"
    env_file:
      - ./.env

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    env_file:
      - ./.env

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - ./.env

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "8084:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # turn:
  #   image: instrumentisto/coturn
  #   container_name: turn
  #   ports:
  #     - "3478:3478/udp"
  #     - "5349:5349/tcp"
  #   env_file:
  #     - ./.env
  #   command: ["-n", "--log-file=stdout", "--min-port=49160", "--max-port=49200"]

networks:
  default:
    name: remotebt_net

volumes:
  redis_data:
  pg_data:
  pgadmin_data:
  caddy_data:
  caddy_config:
